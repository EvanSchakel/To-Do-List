spring.application.name=todolist
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# Security configuration
cors.allowed-origins=http://localhost:3000

# ⚡ Bolt Performance Optimization:
# Disable Open Session In View (OSIV) to release database connections immediately
# after the service layer completes, rather than holding them open during JSON serialization.
# This prevents connection pool exhaustion under high load.
spring.jpa.open-in-view=false
